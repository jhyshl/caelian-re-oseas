name: Beta

on:
  workflow_dispatch:
  workflow_run:
    workflows: [Alpha]
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: release-pages-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      contains(github.event.workflow_run.head_commit.message, '[release-beta]'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run content:verify
      - name: Restore latest published Alpha or Beta site
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_run="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId,workflowName,createdAt \
              --jq '[.[] | select(.workflowName == "Alpha" or .workflowName == "Beta")][0].databaseId // empty'
          )"
          if [[ -z "$previous_run" ]]; then
            echo "No previous Pages artifact is available."
            exit 0
          fi
          mkdir -p .previous-artifact .previous-site
          if ! gh run download "$previous_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name github-pages \
            --dir .previous-artifact; then
            echo "Previous Pages artifact has expired; continuing without history."
            exit 0
          fi
          archive="$(find .previous-artifact -name artifact.tar -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "Previous Pages artifact did not contain artifact.tar."
            exit 0
          fi
          tar -xf "$archive" -C .previous-site
          mkdir -p dist
          cp -a .previous-site/. dist/
      - run: npm run build:beta
        env:
          CAELIAN_BUILD_ID: ${{ github.event.workflow_run.head_sha || github.sha }}-beta
          CAELIAN_BETA_RELEASE: '1'
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
          retention-days: 30

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Beta to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
