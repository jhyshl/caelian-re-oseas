name: Alpha

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('alpha-{0}', github.ref) || format('release-pages-{0}', github.repository) }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run content:verify
      - name: Restore previous immutable Pages builds
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          previous_run="$(
            gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --branch main \
              --status success \
              --limit 20 \
              --json databaseId,workflowName,createdAt \
              --jq '[.[] | select(.workflowName == "Alpha" or .workflowName == "Beta")][0].databaseId // empty'
          )"
          if [[ -z "$previous_run" ]]; then
            echo "No previous successful Pages artifact is available."
            exit 0
          fi
          mkdir -p .previous-artifact .previous-site
          if ! gh run download "$previous_run" \
            --repo "$GITHUB_REPOSITORY" \
            --name github-pages \
            --dir .previous-artifact; then
            echo "Previous Pages artifact has expired; continuing without history."
            exit 0
          fi
          archive="$(find .previous-artifact -name artifact.tar -print -quit)"
          if [[ -z "$archive" ]]; then
            echo "Previous Pages artifact did not contain artifact.tar."
            exit 0
          fi
          tar -xf "$archive" -C .previous-site
          mkdir -p dist
          cp -a .previous-site/. dist/
      - run: npm run build:alpha
        env:
          CAELIAN_BUILD_ID: ${{ github.sha }}
          CAELIAN_REQUIRE_RELEASE_NOTE: ${{ github.event_name == 'pull_request' && '0' || '1' }}
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Deploy Alpha to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
